packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true
  redis-memory-server: true
  "@parcel/watcher": false
  "@swc/core": false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - eslint@10.14.0
  - "@embedded-postgres/darwin-arm64@18.6.0-beta.19"
  - "@embedded-postgres/darwin-x64@18.6.0-beta.19"
  - "@embedded-postgres/linux-arm64@18.6.0-beta.19"
  - "@embedded-postgres/linux-arm@18.6.0-beta.19"
  - "@embedded-postgres/linux-ia32@18.6.0-beta.19"
  - "@embedded-postgres/linux-ppc64@18.6.0-beta.19"
  - "@embedded-postgres/linux-x64@18.6.0-beta.19"
  - "@embedded-postgres/windows-x64@18.6.0-beta.19"
  - embedded-postgres@18.6.0-beta.19
  - bullmq@6.5.3
